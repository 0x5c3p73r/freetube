name: Build workflow
on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ipa
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build
        run: |
          bundle install --jobs 4 --retry 3 || true
          bundle exec fastlane build_unsign_ipa || fastlane build_unsign_ipa
          cp FreeTube.ipa "FreeTube-${{ github.sha }}-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTube-${{ github.sha }}-unsigned.ipa
          path: FreeTube-${{ github.sha }}-unsigned.ipa

      - name: Delete GitHub release if exist then create release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.fork == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "nightly" && gh release delete "nightly" -y --cleanup-tag || true
          gh release create "nightly" "FreeTube-${{ github.sha }}-unsigned.ipa" -t "Nightly" -p --notes "Nightly build for commit ${{ github.sha }}"
